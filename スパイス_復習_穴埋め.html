<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スパイスとハーブ 復習</title>
<style>
:root{
  --main:#8a5a2b; --main-dark:#6b4420; --main-light:#b08050; --accent:#c8a24a;
  --bg:#f8f5f1; --card:#ffffff; --text:#2c2724; --sub:#6b625e; --line:#e6ddd4;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;-webkit-text-size-adjust:100%;}
header{background:var(--main);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
header .ch{font-size:12px;letter-spacing:.12em;opacity:.85;}
header .ttl{font-size:15px;font-weight:700;}
header .right{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;}
header .timer{font-size:15px;font-weight:700;}
header .count{font-size:12px;opacity:.9;}
main{flex:1;display:flex;justify-content:center;padding:18px 14px 8px;}
.slide{width:100%;max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:26px 28px 30px;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.slide{animation:none;}}
.eyebrow{display:inline-block;font-size:11px;letter-spacing:.14em;color:var(--main);background:#f3ebe2;border-radius:20px;padding:4px 12px;margin-bottom:12px;font-weight:700;}
h2{font-size:23px;line-height:1.4;color:var(--main-dark);border-bottom:3px solid var(--main);padding-bottom:9px;margin-bottom:18px;}
ul{list-style:none;}
li{position:relative;padding-left:20px;margin-bottom:11px;line-height:1.95;font-size:16px;}
li::before{content:"";position:absolute;left:2px;top:.78em;width:8px;height:8px;border-radius:2px;background:var(--main-light);}
.note{margin-top:16px;padding:11px 14px;font-size:13.5px;line-height:1.75;background:#faf6ee;border-left:4px solid var(--accent);border-radius:0 6px 6px 0;color:#5c4f38;}
.note b{color:#8a6a20;}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px;}
th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;line-height:1.9;vertical-align:top;}
th{background:var(--main);color:#fff;font-weight:700;white-space:nowrap;}
tbody tr:nth-child(even){background:#faf8f6;}
.lead{margin-bottom:14px;line-height:1.95;font-size:15.5px;}
.blank{display:inline-block;min-width:4.2em;text-align:center;padding:1px 8px;margin:0 1px;cursor:pointer;user-select:none;background:#efe3d6;color:transparent;border-bottom:2px dashed var(--main-light);border-radius:4px;transition:background .15s,color .15s;}
.blank:hover{background:#e3d2bf;}
.blank:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.blank.open{background:transparent;color:var(--main-dark);font-weight:700;border-bottom:2px solid var(--accent);cursor:default;}
.blank.hint{animation:pulse .9s ease;}
@keyframes pulse{0%,100%{background:#efe3d6;}50%{background:var(--accent);}}
@media (prefers-reduced-motion:reduce){.blank.hint{animation:none;}}
.cover{text-align:center;padding:42px 20px;}
.cover .sub{font-size:14px;letter-spacing:.2em;color:var(--main-light);margin-bottom:14px;}
.cover h1{font-size:30px;color:var(--main-dark);line-height:1.4;margin-bottom:22px;}
.cover .idx{display:inline-block;text-align:left;background:#faf8f6;border:1px solid var(--line);border-radius:10px;padding:16px 22px;font-size:15px;line-height:2;}
.cover .idx b{color:var(--main);}
.cover .howto{margin-top:20px;font-size:14px;line-height:1.9;color:var(--sub);text-align:left;display:inline-block;max-width:560px;}
footer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px 14px;}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.tools button{font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--main);background:#fff;color:var(--main);padding:8px 15px;border-radius:22px;transition:.15s;}
.tools button:hover{background:var(--main);color:#fff;}
.tools button.primary{background:var(--main);color:#fff;}
.tools button.primary:hover{background:var(--main-dark);border-color:var(--main-dark);}
.tools button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.nav{display:flex;align-items:center;justify-content:center;gap:14px;}
.nav button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:var(--main);color:#fff;width:40px;height:40px;border-radius:50%;}
.nav button:disabled{background:#d4c9bd;cursor:default;}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:520px;}
.dots .dot{width:9px;height:9px;min-width:0;flex:none;border-radius:50%;background:#d9cdc0;border:none;padding:0;cursor:pointer;}
.dots .dot.active{background:var(--main);transform:scale(1.35);}
.dots .dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:60;}
.modal.on{display:flex;}
.modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:82vh;overflow:auto;padding:22px 24px;}
.modal h3{font-size:18px;color:var(--main-dark);margin-bottom:12px;}
.modal table{min-width:0;font-size:14px;}
.modal textarea{width:100%;height:120px;margin-top:12px;font-family:ui-monospace,monospace;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:8px;}
.modal .close{margin-top:14px;}
.warn{font-size:13px;color:#8a3a3a;background:#fcf0ef;border-left:4px solid #c05a52;padding:10px 12px;border-radius:0 6px 6px 0;margin-top:12px;line-height:1.7;}
</style></head>
<body>
<header>
  <div>
    <div class="ch">記憶保持研究　復習用</div>
    <div class="ttl">スパイスとハーブ</div>
  </div>

    <div class="timer">本日 <span id="tmr">0:00</span></div>

  </div>
</header>
<main><div class="slide" id="slide"></div></main>
<footer>
  <div class="tools">
    <button id="btnNext" class="primary">次のカッコを開く</button>
    <button id="btnReset">このスライドをリセット</button>
    <button id="btnLog">学習記録</button>
  </div>
  <div class="nav">
    <button id="prev" aria-label="前のスライド">◀</button>
    <div class="dots" id="dots"></div>
    <button id="next" aria-label="次のスライド">▶</button>
  </div>
</footer>

<div class="modal" id="modal">
  <div class="box">
    <h3>学習記録</h3>
    <div id="logTable"></div>
    <textarea id="logText" readonly></textarea>

    <div class="tools close"><button id="btnCopy">記録をコピー</button><button id="btnClose" class="primary">閉じる</button></div>
  </div>
</div>

   "[[17世紀]]には[[オランダ東インド会社]]がモルッカ諸島の香辛料貿易を独占した",
   "日本では、奈良時代の[[正倉院]]の宝物のなかに、薬物として[[コショウ]]が収められている"
  ],
  "note": "<b>2人の航海者：</b>コロンブス（1492年・西回り・アメリカ大陸）とヴァスコ・ダ・ガマ（1498年・喜望峰回り・インド）。年と向かった方角で区別します。"
 }
];
</script>
<script>
/* ---------- 学習記録 ---------- */
const LS = 'spiceReview.v1';
function todayKey(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function loadLog(){ try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){ return {}; } }
function saveLog(){ try { localStorage.setItem(LS, JSON.stringify(LOG)); } catch(e){} }
const LOG = loadLog();
const TK = todayKey();
if(!LOG[TK]) LOG[TK] = { sec:0, opens:0, visits:0, first:new Date().toTimeString().slice(0,5), last:'' };
LOG[TK].visits++;
LOG[TK].last = new Date().toTimeString().slice(0,5);
saveLog();

function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
const tmrEl = document.getElementById('tmr');
function paintTimer(){ tmrEl.textContent = fmt(LOG[TK].sec); }
paintTimer();
setInterval(()=>{
  if(document.hidden) return;
  LOG[TK].sec++;
  LOG[TK].last = new Date().toTimeString().slice(0,5);
  paintTimer();
  if(LOG[TK].sec % 5 === 0) saveLog();
}, 1000);
window.addEventListener('beforeunload', saveLog);
document.addEventListener('visibilitychange', saveLog);

/* ---------- スライド描画 ---------- */
const slideEl = document.getElementById('slide');
const dotsEl = document.getElementById('dots');
let idx = 0;
function blanks(t){
  return String(t).replace(/\[\[(.+?)\]\]/g, (m,a)=>'<span class="blank" tabindex="0" role="button" aria-label="空欄">'+a+'</span>');
}
const li = arr => arr.map(t => '<li>'+blanks(t)+'</li>').join('');

function render(){
  const s = SLIDES[idx]; let h='';
  if(s.type === 'cover'){
    h = '<div class="cover"><div class="sub">'+s.sub+'</div><h1>'+s.title+'</h1>'
      + '<div class="idx">'+s.index.join('<br>')+'</div>'
      + '<div class="howto">'+s.howto+'</div></div>';
  } else {
    h += '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2>';
    if(s.lead) h += '<p class="lead">'+blanks(s.lead)+'</p>';
    if(s.type === 'p'){ h += '<ul>'+li(s.items)+'</ul>'; }
    else if(s.type === 'tbl'){
      h += '<div class="tblwrap"><table><thead><tr>'+s.head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'
         + s.rows.map(r=>'<tr>'+r.map(c=>'<td>'+blanks(c)+'</td>').join('')+'</tr>').join('')
         + '</tbody></table></div>';
    }
    if(s.note) h += '<div class="note">'+s.note+'</div>';
  }
  slideEl.innerHTML = h;
  document.getElementById('cur').textContent = idx+1;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active', i===idx));
  document.getElementById('prev').disabled = (idx===0);
  document.getElementById('next').disabled = (idx===SLIDES.length-1);
  slideEl.querySelectorAll('.blank').forEach(b=>{
    const open = ()=>{ if(b.classList.contains('open')) return; b.classList.add('open'); LOG[TK].opens++; saveLog(); };
    b.addEventListener('click', open);
    b.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
  });
  window.scrollTo({top:0,behavior:'instant'});
}
document.getElementById('tot').textContent = SLIDES.length;
SLIDES.forEach((_,i)=>{
  const b=document.createElement('button'); b.className='dot';
  b.setAttribute('aria-label','スライド'+(i+1)); b.onclick=()=>{ idx=i; render(); };
  dotsEl.appendChild(b);
});
document.getElementById('prev').onclick = ()=>{ if(idx>0){ idx--; render(); } };
document.getElementById('next').onclick = ()=>{ if(idx<SLIDES.length-1){ idx++; render(); } };
document.getElementById('btnNext').onclick = ()=>{
  const b = slideEl.querySelector('.blank:not(.open)');
  if(b){ b.classList.add('open','hint'); LOG[TK].opens++; saveLog();
    setTimeout(()=>b.classList.remove('hint'),900);
    b.scrollIntoView({block:'center',behavior:'smooth'}); }
};
document.getElementById('btnReset').onclick = ()=>slideEl.querySelectorAll('.blank').forEach(b=>b.classList.remove('open'));
document.addEventListener('keydown', e=>{
  if(document.getElementById('modal').classList.contains('on')) return;
  if(e.target.classList && e.target.classList.contains('blank')) return;
  if(e.key==='ArrowRight' && idx<SLIDES.length-1){ idx++; render(); }
  if(e.key==='ArrowLeft' && idx>0){ idx--; render(); }
});

/* ---------- 記録表示 ---------- */
const modal = document.getElementById('modal');
document.getElementById('btnLog').onclick = ()=>{
  saveLog();
  const days = Object.keys(LOG).sort();
  let rows = '<table><thead><tr><th>日付</th><th>学習時間</th><th>開いたカッコ</th><th>開始</th><th>最終</th></tr></thead><tbody>';
  let txt = '日付\t学習時間(秒)\t開いたカッコ\t開始\t最終\n';
  days.forEach(d=>{
    const v = LOG[d];
    rows += '<tr><td>'+d+'</td><td>'+fmt(v.sec)+'</td><td>'+v.opens+'</td><td>'+(v.first||'')+'</td><td>'+(v.last||'')+'</td></tr>';
    txt += d+'\t'+v.sec+'\t'+v.opens+'\t'+(v.first||'')+'\t'+(v.last||'')+'\n';
  });
  rows += '</tbody></table>';
  document.getElementById('logTable').innerHTML = rows;
  document.getElementById('logText').value = txt;
  modal.classList.add('on');
};
document.getElementById('btnClose').onclick = ()=>modal.classList.remove('on');
modal.addEventListener('click', e=>{ if(e.target===modal) modal.classList.remove('on'); });
document.getElementById('btnCopy').onclick = ()=>{
  const t = document.getElementById('logText'); t.select();
  try { document.execCommand('copy'); } catch(e){}
};

render();
</script>
</body>
</html>
